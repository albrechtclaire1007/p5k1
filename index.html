<!DOCTYPE html>
<html lang="lb">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>P5 – Verben</title>

<style>
@font-face{
  font-family:'Schoulschrëft';
  src:url('https://raw.githubusercontent.com/albrechtclaire1007/schoulschreft/main/schoulschreft_bold%5B2%5D.TTF') format('truetype');
  font-weight:bold;
  font-style:normal;
  font-display:swap;
}

:root{
  --bg1:#FCF09C;
  --bg2:#FFD51E;
  --bar:#1f1f1f;
  --barBorder:#000;
  --ink:#1f1f1f;
  --white:#fff;
  --border:3px;
  --shadow:0 10px 24px rgba(0,0,0,.08);
  --pad:clamp(10px,2.2vw,16px);
  --r:18px;
  --ok:#0b7a35;
  --bad:#b32b2b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  outline:none;
}

html,body{
  min-height:100%;
  margin:0;
  background:linear-gradient(135deg,var(--bg2),var(--bg1));
  color:var(--ink);
  font-family:'Schoulschrëft',Arial,sans-serif;
}

button,input,select{
  font-family:'Schoulschrëft',Arial,sans-serif;
}

button:focus-visible{
  outline:4px solid rgba(255,255,255,.8);
  outline-offset:2px;
}

.topBar{
  position:sticky;
  top:10px;
  z-index:10;
  width:min(1200px,96vw);
  margin:10px auto 0;
  background:var(--bar);
  border:var(--border) solid var(--barBorder);
  border-radius:999px;
  box-shadow:var(--shadow);
  padding:10px 12px;
  display:grid;
  grid-template-columns:70px 1fr auto;
  align-items:center;
  gap:10px;
}

.barBtn{
  border:none;
  background:transparent;
  cursor:pointer;
  display:grid;
  place-items:center;
  width:54px;
  height:54px;
}

.barBtn img{
  width:46px;
  height:46px;
  object-fit:contain;
}

.barBtn.back img{transform:rotate(180deg);}
.barBtn:active{transform:scale(.98);}

.barTitle{
  text-align:center;
  color:#fff;
  font-size:clamp(1.35rem,3vw,2.25rem);
  margin:0;
  line-height:1.1;
}

.barRight{
  display:flex;
  align-items:center;
  gap:6px;
}

.barRight .barBtn{
  width:50px;
  height:50px;
}

.barRight .barBtn img{
  width:42px;
  height:42px;
}

.wrap{
  width:min(1200px,96vw);
  margin:18px auto 26px;
  padding:var(--pad);
  display:flex;
  flex-direction:column;
  gap:14px;
}

.exercise{display:none;}
.exercise.active{display:block;}

.card{
  background:rgba(255,255,255,.82);
  border:var(--border) solid rgba(255,255,255,.65);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:clamp(12px,2.2vw,18px);
}

.instruction{
  border:3px solid rgba(0,0,0,.08);
  border-radius:16px;
  padding:14px;
  text-align:center;
  font-size:clamp(1.05rem,2.2vw,1.3rem);
  margin-bottom:14px;
  background:rgba(255,255,255,.7);
}

.bigBox{
  width:min(900px,100%);
  margin:0 auto;
  background:#fff;
  border:3px solid rgba(0,0,0,.08);
  border-radius:18px;
  padding:clamp(18px,4vw,28px);
  text-align:center;
}

.verbHint{
  font-size:clamp(1rem,2vw,1.2rem);
  opacity:.65;
  margin-bottom:8px;
}

.prompt{
  font-size:clamp(2rem,5vw,3rem);
  line-height:1.2;
}

.sentence{
  font-size:clamp(1.75rem,4.3vw,2.75rem);
  line-height:1.3;
}

.blank{
  display:inline-block;
  min-width:120px;
  border-bottom:4px solid var(--ink);
  transform:translateY(-2px);
}

.choices{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}

.choice,
.revealBtn{
  padding:12px 18px;
  border-radius:16px;
  border:2px solid rgba(0,0,0,.15);
  background:#fff;
  font-size:clamp(1.1rem,2.2vw,1.35rem);
  cursor:pointer;
  color:var(--ink);
}

.choice:hover,
.revealBtn:hover{
  transform:translateY(-1px);
}

.choice:active,
.revealBtn:active{
  transform:scale(.98);
}

.choice.correct{
  border-color:var(--ok);
  background:#eaf8ef;
}

.choice.wrong{
  border-color:var(--bad);
  background:#fff0f0;
}

.feedback{
  text-align:center;
  font-size:clamp(1.1rem,2.2vw,1.4rem);
  min-height:1.5em;
  margin-top:10px;
}

.feedback.ok{color:var(--ok);}
.feedback.bad{color:var(--bad);}

.solution{
  min-height:1.5em;
  margin-top:16px;
  font-size:clamp(1.5rem,3.5vw,2.1rem);
  color:var(--ok);
}

.progress{
  text-align:center;
  margin-top:12px;
  font-size:clamp(.95rem,1.8vw,1.1rem);
  opacity:.6;
}

.bottomNav{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:16px;
}

.bottomBtn{
  width:60px;
  height:60px;
  border:none;
  background:#fff;
  border-radius:999px;
  border:3px solid rgba(0,0,0,.2);
  cursor:pointer;
  display:grid;
  place-items:center;
}

.bottomBtn img{
  width:40px;
  height:40px;
}

.bottomBtn.back img{
  transform:rotate(180deg);
}

.bottomBtn:active{
  transform:scale(.95);
}

@media (max-width:620px){
  .topBar{
    grid-template-columns:52px 1fr auto;
    gap:4px;
    padding:8px 8px;
  }

  .barBtn{
    width:46px;
    height:46px;
  }

  .barBtn img{
    width:40px;
    height:40px;
  }

  .barRight{
    gap:0;
  }

  .barRight .barBtn{
    width:42px;
    height:46px;
  }

  .barRight .barBtn img{
    width:36px;
    height:36px;
  }

  .barTitle{
    font-size:clamp(1.1rem,5vw,1.55rem);
  }
}
</style>
</head>

<body>

<div class="topBar">
  <button class="barBtn back" id="prevPage" aria-label="Viregt Spill">
    <img src="https://i.postimg.cc/BL81zWV4/p5arrow.png" alt="">
  </button>

  <h1 class="barTitle" id="title">P5 – Verben</h1>

  <div class="barRight">
    <button class="barBtn" id="play" aria-label="Virlesen">
      <img src="https://i.postimg.cc/vg16KRNQ/p5play.png" alt="">
    </button>
    <button class="barBtn" id="replay" aria-label="Nei ufänken">
      <img src="https://i.postimg.cc/Q9BWzLyj/p5replay.png" alt="">
    </button>
    <button class="barBtn" id="nextPage" aria-label="Nächst Spill">
      <img src="https://i.postimg.cc/BL81zWV4/p5arrow.png" alt="">
    </button>
  </div>
</div>

<div class="wrap">

<!-- GAME 1 -->
<section class="exercise active" id="g1">
  <div class="card">
    <div class="instruction">Wéi ass déi richteg konjugéiert Form?</div>

    <div class="bigBox">
      <div class="verbHint" id="g1Verb"></div>
      <div class="prompt" id="g1Prompt"></div>
      <div class="choices" id="g1Choices"></div>
    </div>

    <div class="feedback" id="g1Fb"></div>
    <div class="progress" id="g1Progress"></div>
  </div>
</section>

<!-- GAME 2 -->
<section class="exercise" id="g2">
  <div class="card">
    <div class="instruction">Fëll de Saz mat der richteger Form aus.</div>

    <div class="bigBox">
      <div class="verbHint" id="g2Verb"></div>
      <div class="sentence" id="g2Prompt"></div>
      <div class="choices" id="g2Choices"></div>
    </div>

    <div class="feedback" id="g2Fb"></div>
    <div class="progress" id="g2Progress"></div>
  </div>
</section>

<!-- GAME 3 -->
<section class="exercise" id="g3">
  <div class="card">
    <div class="instruction">Konjugéier mëndlech. Da kontrolléier deng Äntwert.</div>

    <div class="bigBox">
      <div class="verbHint" id="g3Verb"></div>
      <div class="prompt" id="g3Prompt"></div>
      <button class="revealBtn" id="g3Reveal">Léisung weisen</button>
      <div class="solution" id="g3Solution"></div>
    </div>

    <div class="bottomNav">
      <button class="bottomBtn back" id="g3Prev" aria-label="Viregt Beispill">
        <img src="https://i.postimg.cc/BL81zWV4/p5arrow.png" alt="">
      </button>

      <button class="bottomBtn" id="g3Next" aria-label="Nächst Beispill">
        <img src="https://i.postimg.cc/BL81zWV4/p5arrow.png" alt="">
      </button>
    </div>

    <div class="progress" id="g3Progress"></div>
  </div>
</section>

</div>

<script>
const PERSONS=[
  {key:"ech",label:"ech"},
  {key:"du",label:"du"},
  {key:"hien",label:"hien/hatt"},
  {key:"mir",label:"mir"},
  {key:"dir",label:"dir"},
  {key:"si",label:"si"}
];

const VERBS=[
  {
    inf:"kommen",
    forms:{
      ech:"kommen",
      du:"kënns",
      hien:"kënnt",
      mir:"kommen",
      dir:"kommt",
      si:"kommen"
    }
  },
  {
    inf:"wunnen",
    forms:{
      ech:"wunnen",
      du:"wunns",
      hien:"wunnt",
      mir:"wunnen",
      dir:"wunnt",
      si:"wunnen"
    }
  },
  {
    inf:"schwätzen",
    forms:{
      ech:"schwätzen",
      du:"schwätz",
      hien:"schwätzt",
      mir:"schwätzen",
      dir:"schwätzt",
      si:"schwätzen"
    }
  },
  {
    inf:"sinn",
    forms:{
      ech:"sinn",
      du:"bass",
      hien:"ass",
      mir:"sinn",
      dir:"sidd",
      si:"sinn"
    }
  }
];

const SENTENCES=[
  {verb:"kommen",person:"ech",html:'Ech <span class="blank"></span> aus Lëtzebuerg.'},
  {verb:"kommen",person:"du",html:'Du <span class="blank"></span> aus Frankräich.'},
  {verb:"kommen",person:"hien",html:'Hien <span class="blank"></span> aus der Belsch.'},
  {verb:"kommen",person:"mir",html:'Mir <span class="blank"></span> aus Diddeleng.'},
  {verb:"kommen",person:"dir",html:'Dir <span class="blank"></span> aus Däitschland.'},
  {verb:"kommen",person:"si",html:'Si <span class="blank"></span> aus Esch.'},

  {verb:"wunnen",person:"ech",html:'Ech <span class="blank"></span> zu Diddeleng.'},
  {verb:"wunnen",person:"du",html:'Du <span class="blank"></span> zu Esch.'},
  {verb:"wunnen",person:"hien",html:'Hatt <span class="blank"></span> zu Beetebuerg.'},
  {verb:"wunnen",person:"mir",html:'Mir <span class="blank"></span> zu Lëtzebuerg.'},
  {verb:"wunnen",person:"dir",html:'Dir <span class="blank"></span> zu Schëffleng.'},
  {verb:"wunnen",person:"si",html:'Si <span class="blank"></span> zu Déifferdeng.'},

  {verb:"schwätzen",person:"ech",html:'Ech <span class="blank"></span> Lëtzebuergesch.'},
  {verb:"schwätzen",person:"du",html:'Du <span class="blank"></span> Franséisch.'},
  {verb:"schwätzen",person:"hien",html:'Hien <span class="blank"></span> Däitsch.'},
  {verb:"schwätzen",person:"mir",html:'Mir <span class="blank"></span> Englesch.'},
  {verb:"schwätzen",person:"dir",html:'Dir <span class="blank"></span> Lëtzebuergesch.'},
  {verb:"schwätzen",person:"si",html:'Si <span class="blank"></span> Franséisch.'},

  {verb:"sinn",person:"ech",html:'Ech <span class="blank"></span> an der Schoul.'},
  {verb:"sinn",person:"du",html:'Du <span class="blank"></span> 10 Joer al.'},
  {verb:"sinn",person:"hien",html:'Hatt <span class="blank"></span> doheem.'},
  {verb:"sinn",person:"mir",html:'Mir <span class="blank"></span> an der Klass.'},
  {verb:"sinn",person:"dir",html:'Dir <span class="blank"></span> prett.'},
  {verb:"sinn",person:"si",html:'Si <span class="blank"></span> am Gaart.'}
];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function personLabel(key){
  return PERSONS.find(p=>p.key===key).label;
}

function verbData(inf){
  return VERBS.find(v=>v.inf===inf);
}

function correctForm(verb,person){
  return verbData(verb).forms[person];
}

function distinctForms(verb){
  return [...new Set(Object.values(verbData(verb).forms))];
}

function choiceSet(verb,person){
  const correct=correctForm(verb,person);
  const pool=shuffle(distinctForms(verb).filter(x=>x!==correct));

  while(pool.length<2){
    const other=shuffle(
      VERBS
        .filter(v=>v.inf!==verb)
        .flatMap(v=>Object.values(v.forms))
        .filter(x=>x!==correct && !pool.includes(x))
    )[0];
    if(other) pool.push(other);
    else break;
  }

  return shuffle([correct,...pool.slice(0,2)]);
}

function setFeedback(id,ok){
  const el=document.getElementById(id);
  el.textContent=ok?"Richteg!":"Probéier nach eng Kéier.";
  el.className="feedback "+(ok?"ok":"bad");
}

function clearFeedback(id){
  const el=document.getElementById(id);
  el.textContent="";
  el.className="feedback";
}

function updateProgress(id,index,total){
  document.getElementById(id).textContent=(index+1)+" / "+total;
}

/* ===== GAME 1 ===== */

let g1Deck=[];
let g1Index=0;
let g1Locked=false;

function buildDeck(){
  const deck=[];
  VERBS.forEach(v=>{
    PERSONS.forEach(p=>{
      deck.push({verb:v.inf,person:p.key});
    });
  });
  return shuffle(deck);
}

function g1Render(){
  const item=g1Deck[g1Index];
  g1Locked=false;
  clearFeedback("g1Fb");

  document.getElementById("g1Verb").textContent=item.verb;
  document.getElementById("g1Prompt").textContent=personLabel(item.person);
  updateProgress("g1Progress",g1Index,g1Deck.length);

  const correct=correctForm(item.verb,item.person);
  const options=choiceSet(item.verb,item.person);
  const wrap=document.getElementById("g1Choices");
  wrap.innerHTML="";

  options.forEach(option=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=option;

    b.onclick=()=>{
      if(g1Locked) return;

      const ok=option===correct;
      setFeedback("g1Fb",ok);

      if(ok){
        g1Locked=true;
        b.classList.add("correct");
        setTimeout(()=>{
          g1Index++;
          if(g1Index>=g1Deck.length){
            g1Deck=buildDeck();
            g1Index=0;
          }
          g1Render();
        },650);
      }else{
        b.classList.add("wrong");
        setTimeout(()=>b.classList.remove("wrong"),500);
      }
    };

    wrap.appendChild(b);
  });
}

function g1Reset(){
  g1Deck=buildDeck();
  g1Index=0;
  g1Render();
}

/* ===== GAME 2 ===== */

let g2Deck=[];
let g2Index=0;
let g2Locked=false;

function g2Render(){
  const item=g2Deck[g2Index];
  g2Locked=false;
  clearFeedback("g2Fb");

  document.getElementById("g2Verb").textContent=item.verb;
  document.getElementById("g2Prompt").innerHTML=item.html;
  updateProgress("g2Progress",g2Index,g2Deck.length);

  const correct=correctForm(item.verb,item.person);
  const options=choiceSet(item.verb,item.person);
  const wrap=document.getElementById("g2Choices");
  wrap.innerHTML="";

  options.forEach(option=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=option;

    b.onclick=()=>{
      if(g2Locked) return;

      const ok=option===correct;
      setFeedback("g2Fb",ok);

      if(ok){
        g2Locked=true;
        b.classList.add("correct");
        setTimeout(()=>{
          g2Index++;
          if(g2Index>=g2Deck.length){
            g2Deck=shuffle(SENTENCES);
            g2Index=0;
          }
          g2Render();
        },650);
      }else{
        b.classList.add("wrong");
        setTimeout(()=>b.classList.remove("wrong"),500);
      }
    };

    wrap.appendChild(b);
  });
}

function g2Reset(){
  g2Deck=shuffle(SENTENCES);
  g2Index=0;
  g2Render();
}

/* ===== GAME 3 ===== */

let g3Deck=[];
let g3Index=0;
let g3Revealed=false;

function g3Render(){
  const item=g3Deck[g3Index];
  g3Revealed=false;

  document.getElementById("g3Verb").textContent=item.verb;
  document.getElementById("g3Prompt").textContent=personLabel(item.person);
  document.getElementById("g3Solution").textContent="";
  document.getElementById("g3Reveal").textContent="Léisung weisen";
  updateProgress("g3Progress",g3Index,g3Deck.length);
}

function g3Reveal(){
  const item=g3Deck[g3Index];
  g3Revealed=!g3Revealed;
  document.getElementById("g3Solution").textContent=
    g3Revealed ? personLabel(item.person)+" "+correctForm(item.verb,item.person) : "";
  document.getElementById("g3Reveal").textContent=
    g3Revealed ? "Léisung verstoppen" : "Léisung weisen";
}

function g3Next(){
  g3Index++;
  if(g3Index>=g3Deck.length){
    g3Deck=buildDeck();
    g3Index=0;
  }
  g3Render();
}

function g3Prev(){
  g3Index--;
  if(g3Index<0) g3Index=g3Deck.length-1;
  g3Render();
}

function g3Reset(){
  g3Deck=buildDeck();
  g3Index=0;
  g3Render();
}

document.getElementById("g3Reveal").onclick=g3Reveal;
document.getElementById("g3Next").onclick=g3Next;
document.getElementById("g3Prev").onclick=g3Prev;

/* ===== NAV ===== */

const exercises=[...document.querySelectorAll(".exercise")];
let exIndex=0;

function showExercise(i){
  exercises.forEach((e,n)=>e.classList.toggle("active",n===i));
  exIndex=i;
}

document.getElementById("prevPage").onclick=()=>{
  showExercise((exIndex+exercises.length-1)%exercises.length);
};

document.getElementById("nextPage").onclick=()=>{
  showExercise((exIndex+1)%exercises.length);
};

document.getElementById("replay").onclick=()=>{
  if(exIndex===0) g1Reset();
  if(exIndex===1) g2Reset();
  if(exIndex===2) g3Reset();
};

/* ===== SPEECH ===== */

function currentSpeechText(){
  if(exIndex===0){
    const item=g1Deck[g1Index];
    return item.verb+", "+personLabel(item.person);
  }

  if(exIndex===1){
    const item=g2Deck[g2Index];
    return item.html.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  }

  const item=g3Deck[g3Index];
  return item.verb+", "+personLabel(item.person);
}

document.getElementById("play").onclick=()=>{
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(currentSpeechText());
  utterance.lang="lb-LU";
  utterance.rate=.9;
  speechSynthesis.speak(utterance);
};

/* ===== INIT ===== */

g1Deck=buildDeck();
g2Deck=shuffle(SENTENCES);
g3Deck=buildDeck();

g1Render();
g2Render();
g3Render();
</script>

</body>
</html>
